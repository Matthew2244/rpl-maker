name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v

  windows-app:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install wxPython pyinstaller prismatoid
      - name: Inno Setup, for the installer
        shell: pwsh
        run: if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: What a screen reader gets from the window (MSAA, as NVDA and JAWS read it)
        run: |
          python -m pip install comtypes
          python tools/win_acc_check.py
      - run: python build_app.py
      - name: Install quietly, run the installed app's self-test, uninstall
        shell: pwsh
        run: |
          $p = Start-Process dist\Magpie-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\Magpie"
          if (-not (Test-Path "$app\Magpie.exe")) { throw "not installed where expected" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Magpie.lnk")) { throw "no Start menu entry" }
          $t = Start-Process "$app\Magpie.exe" -ArgumentList '--self-test' -Wait -PassThru -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          if ($t.ExitCode -ne 0) { throw "installed self-test failed" }
          $c = Start-Process "$app\Magpie.exe" -ArgumentList 'access' -Wait -PassThru -RedirectStandardOutput access.txt
          Get-Content access.txt
          if ($c.ExitCode -ne 0 -and $c.ExitCode -ne 3) { throw "Check Folder Access crashed (exit $($c.ExitCode))" }
          if (-not (Select-String -Path access.txt -Pattern "preset folders" -Quiet)) { throw "Check Folder Access said nothing" }
          $u = Get-ChildItem "$app\unins*.exe" | Select-Object -First 1
          $p = Start-Process $u.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path "$app\Magpie.exe") { throw "uninstall left the app behind" }
          "Installed, self-tested and uninstalled cleanly."
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/Magpie-Setup.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Magpie-Setup.exe
